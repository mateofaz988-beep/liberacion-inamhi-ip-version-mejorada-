server {
    listen 80;
    server_name 10.0.153.69;

    # ── Frontend Angular ──────────────────────────────────────────
    root /var/www/inamhi/frontend;
    index index.html;

    # SPA: todas las rutas caen al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend Flask (proxy) ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    # ── Archivos subidos (servidos directo por Nginx) ────────────
    location /uploads/ {
        alias /var/www/inamhi/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Archivos estáticos del backend (logos PDF, etc.) ─────────
    location /static/ {
        alias /var/www/inamhi/backend/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection      "1; mode=block";

    # ── Compresión ────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
